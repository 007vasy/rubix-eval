<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>rubix-eval — leaderboard</title>
    <link rel="stylesheet" href="./css/solves.css" />
    <link rel="stylesheet" href="./css/leaderboard.css" />
  </head>
  <body>
    <header>
      <div>
        <b>Leaderboard</b>
        <span>Grouped by cube size and scramble depth. Best first. Human WR highlighted on full solves.</span>
      </div>
      <nav>
        <a href="/eval">eval</a>
        <a href="/ai">AI</a>
        <a href="/solves">solves</a>
      </nav>
    </header>
    <main>
      <p id="status">Loading…</p>
      <div class="tabs" role="tablist" aria-label="Group puzzles by">
        <button class="tab active" data-mode="size" type="button">Cube size</button>
        <button class="tab" data-mode="scramble" type="button">How scrambled</button>
      </div>
      <div id="subnav" class="pills" role="tablist"></div>
      <div id="boards"></div>
    </main>
    <script type="module" src="./js/leaderboard.js"></script>
  </body>
</html>
