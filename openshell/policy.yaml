# Verified computer-use policy for NVIDIA OpenShell.
# Deny public internet. inference.local is a runtime exception for the model.
# Only Chromium may talk to the local visual eval. Agent CLIs cannot curl APIs.
version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /app
    - /etc
    - /var/log
    - /opt/rubix-eval
  read_write:
    - /sandbox
    - /tmp
    - /dev/null
    - /eval

landlock:
  compatibility: best_effort

# Chromium loads the local /eval page (HTML/JS/WebGL + boot/submit).
# Do not add claude, codex, grok, curl, or python — those must not fetch cube JSON.
network_policies:
  local_eval:
    name: local-eval
    endpoints:
      - { host: 127.0.0.1, port: 8766 }
      - { host: localhost, port: 8766 }
    binaries:
      - { path: /usr/bin/chromium }
      - { path: /usr/bin/chromium-browser }
      - { path: /usr/bin/google-chrome }
      - { path: /usr/bin/google-chrome-stable }
