name: Bug
description: Something on the eval site or engine is broken
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: URL, cube (3D/4D, size), and what you expected.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - /eval (browser cube)
        - /verified
        - /ai or /leaderboard
        - Inspect / OpenShell harness
        - Other
    validations:
      required: true
